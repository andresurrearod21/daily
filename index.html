<style>
:root {
  --y-50:#FDF4E3;--y-100:#FAE6BE;--y-200:#F5D08A;
  --y-400:#EFB44A;--y-600:#DB9520;--y-800:#8A5A0A;--y-900:#5E3D06;
  --bg:#fff;--bg2:#f9f7f2;--text:#0a0a0a;--muted:#6b7280;--faint:#b8b2a6;
  --border:#eae6dd;--success:#16a34a;--success-bg:#dcfce7;--success-border:#bbf7d0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:'DM Mono',monospace}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

.app{max-width:480px;margin:0 auto;padding:20px 16px}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hdr-title{font-size:20px;font-weight:600;letter-spacing:-0.02em}
.hdr-title span{color:var(--y-600)}
.hdr-sync{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faint)}
.hdr-sync .dot{width:6px;height:6px;border-radius:50%;background:var(--y-400)}
.hdr-sync .dot.off{background:var(--faint)}
.hdr-sub{font-size:12px;color:var(--muted);margin-bottom:22px;line-height:1.4}

/* Score card */
.score{background:var(--bg2);border-radius:16px;padding:20px;margin-bottom:20px}
.score-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.score-date{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:500}
.score-day{font-size:22px;font-weight:300;letter-spacing:-0.02em;margin-top:4px}
.score-num{font-family:'DM Mono',monospace;font-size:36px;font-weight:500;color:var(--y-600);line-height:1}
.score-of{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);margin-top:2px;text-align:right}

/* Win pill */
.win-pill{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.win-pill.win{background:var(--success-bg);border-color:var(--success-border);color:#15803d}
.win-pill .wp-icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--faint)}
.win-pill.win .wp-icon{background:var(--success)}
.win-pill .wp-icon svg{width:11px;height:11px;stroke:white;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.win-pill .wp-count{margin-left:auto;font-family:'DM Mono',monospace;font-size:12px;opacity:0.8}

.streak-bar{margin-top:0}
.streak-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.streak-label b{color:var(--y-600);font-weight:600}
.streak-track{height:6px;background:var(--y-50);border-radius:3px;overflow:hidden}
.streak-fill{height:100%;background:var(--y-400);border-radius:3px;transition:width 0.4s ease}

/* Milestone banner */
.mbanner{display:none;background:var(--y-50);border:1px solid var(--y-100);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--y-800);font-weight:500;text-align:center}
.mbanner.show{display:block;animation:fadeIn 0.3s ease}

/* Block head */
.sh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:500;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sh .count{font-family:'DM Mono',monospace;color:var(--faint)}

/* Check item */
.checks{display:flex;flex-direction:column;gap:6px}
.chk{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;transition:all 0.15s;cursor:pointer;-webkit-user-select:none;user-select:none}
.chk:active{transform:scale(0.99)}
.chk.done{background:var(--bg2);border-color:var(--border)}
.chk.done .chk-name{color:var(--muted);text-decoration:line-through}
.chk.core-item{border-left:3px solid var(--y-200)}
.chk.core-item.done{border-left-color:var(--y-400)}
.chk-circle{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.chk.done .chk-circle{background:var(--y-400);border-color:var(--y-400)}
.chk.core-item .chk-circle{border-color:var(--y-200)}
.chk.core-item.done .chk-circle{background:var(--y-400);border-color:var(--y-400)}
.chk-circle svg{width:13px;height:13px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity 0.15s}
.chk.done .chk-circle svg{opacity:1}
.chk-body{flex:1;min-width:0}
.chk-name{font-size:14px;font-weight:500;letter-spacing:-0.01em;line-height:1.3}
.chk.core-item .chk-name{font-weight:600}
.chk-tag{display:inline-block;font-size:9px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--y-800);background:var(--y-50);border:1px solid var(--y-100);border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:middle}
.chk-freq{font-size:11px;color:var(--faint);margin-top:3px;line-height:1.3}
.chk-time{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);flex-shrink:0;min-width:44px;text-align:right}
.chk.done .chk-time{color:var(--faint)}

/* Capstone (Level Up log) */
.chk.capstone{border:1.5px dashed var(--y-200);background:var(--y-50)}
.chk.capstone.done{background:var(--bg2);border-style:solid;border-color:var(--border)}
.chk.capstone .chk-name{color:var(--y-800)}
.chk.capstone.done .chk-name{color:var(--muted)}

/* Heatmap */
.hm-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:8px}
.hm-grid{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto}
.hm-cell{border-radius:2px;cursor:pointer;transition:transform 0.1s}
.hm-cell:hover{transform:scale(1.3)}
.hm-cell.future{background:transparent!important;cursor:default}
.hm-cell.future:hover{transform:none}
.hm-cell.win{outline:1.5px solid var(--success);outline-offset:-1.5px}
.hm-cell.selected{outline:2px solid var(--text);outline-offset:1px;border-radius:2px}
.hm-legend{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--faint);font-family:'DM Mono',monospace;margin-top:10px}
.hm-legend .boxes{display:flex;gap:2px}
.hm-legend .boxes div{width:12px;height:12px;border-radius:2px}
.hm-note{font-size:10px;color:var(--faint);font-family:'DM Mono',monospace;margin-top:6px;display:flex;align-items:center;gap:5px}
.hm-note .swatch{width:11px;height:11px;border-radius:2px;background:var(--bg);outline:1.5px solid var(--success);outline-offset:-1.5px}

/* Day detail popup */
.day-detail{background:var(--bg2);border-radius:12px;padding:14px;margin-top:10px;display:none;animation:fadeIn 0.2s ease}
.day-detail.show{display:block}
.day-detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.day-detail-date{font-size:13px;font-weight:500}
.day-detail-score{font-family:'DM Mono',monospace;font-size:13px;color:var(--y-600)}
.day-detail-items{display:flex;flex-direction:column;gap:4px}
.day-detail-item{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.day-detail-item .di-icon{font-size:14px}
.day-detail-item.hit{color:var(--y-800)}
.day-detail-item.hit .di-icon{color:var(--y-600)}
.day-detail-item.miss .di-icon{color:var(--faint)}
.day-detail-item.core-di{font-weight:600}

/* Toast */
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:white;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all 0.25s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.win{background:var(--success)}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

// =====================
// STATE
// =====================
let state={
  checks:JSON.parse(localStorage.getItem('de_checks')||'{}'),
  selectedDay:null
};
function save(){localStorage.setItem('de_checks',JSON.stringify(state.checks))}

// =====================
// HELPERS
// =====================
function todayStr(){return dateStr(new Date())}
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function formatDay(d){return d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}
function dowOf(ds){return new Date(ds+'T12:00:00').getDay()}
function itemsForDay(dow){return ITEMS.filter(it=>it.days.includes(dow)).sort((a,b)=>a.t-b.t)}
function coreForDay(dow){return ITEMS.filter(it=>it.core&&it.days.includes(dow))}
function toast(msg,win){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(win?' win':'');setTimeout(()=>t.className='toast',1800)}
function setSync(s){
  const d=document.getElementById('syncDot'),t=document.getElementById('syncText');
  d.className='dot'+(s==='off'?' off':'');
  t.textContent=s==='off'?'offline':sb?'synced':'local';
}

// =====================
// SUPABASE
// =====================
async function pullCloud(){
  if(!sb)return;
  try{
    const checks=await sb.from(TABLE).select('date,item_id').eq('device_id',DID);
    if(checks.error)throw checks.error;
    if(checks.data){
      state.checks={};
      checks.data.forEach(r=>{
        if(!state.checks[r.date])state.checks[r.date]={};
        state.checks[r.date][r.item_id]=true;
      });
      save();
    }
    setSync('ok');
  }catch(e){console.warn('[DE] Pull failed — running local. Create the engine_checks table (see setup notes).',e);setSync('off')}
}
async function pushCheck(date,itemId,on){
  if(!sb)return;
  try{
    on?await sb.from(TABLE).upsert({device_id:DID,date,item_id:itemId},{onConflict:'device_id,date,item_id'})
      :await sb.from(TABLE).delete().eq('device_id',DID).eq('date',date).eq('item_id',itemId);
  }catch(e){setSync('off')}
}

// =====================
// SCORING
// =====================
function dayScore(ds){
  const items=itemsForDay(dowOf(ds));
  const c=state.checks[ds]||{};
  let done=0;items.forEach(it=>{if(c[it.id])done++});
  return{done,total:items.length};
}
function isWinDay(ds){
  const core=coreForDay(dowOf(ds));
  if(!core.length)return false;
  const c=state.checks[ds]||{};
  return core.every(it=>c[it.id]);
}
function isPerfectDay(ds){const s=dayScore(ds);return s.total>0&&s.done===s.total}
function getStreak(){
  let streak=0;const d=new Date();
  if(!isWinDay(todayStr()))d.setDate(d.getDate()-1);
  while(isWinDay(dateStr(d))){streak++;d.setDate(d.getDate()-1)}
  return streak;
}

// =====================
// RENDER
// =====================
function checkRow(it,ds,dayChecks){
  const done=!!dayChecks[it.id];
  const el=document.createElement('div');
  el.className='chk'+(done?' done':'')+(it.core?' core-item':'')+(it.capstone?' capstone':'');
  el.innerHTML=`
    <div class="chk-circle"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></div>
    <div class="chk-body">
      <div class="chk-name">${it.name}${it.core?'<span class="chk-tag">non-negotiable</span>':''}</div>
      ${it.sub?`<div class="chk-freq">${it.sub}</div>`:''}
    </div>
    <div class="chk-time">${it.time}</div>`;
  el.onclick=()=>toggleCheck(ds,it.id);
  return el;
}
function render(){
  const now=new Date();const today=todayStr();const dow=now.getDay();
  const dayChecks=state.checks[today]||{};

  document.getElementById('scoreDay').textContent=formatDay(now);
  const s=dayScore(today);
  document.getElementById('scoreNum').textContent=s.done;
  document.getElementById('scoreOf').textContent='/'+s.total;

  // win pill
  const core=coreForDay(dow);
  const coreDone=core.filter(it=>dayChecks[it.id]).length;
  const won=core.length>0&&coreDone===core.length;
  document.getElementById('winPill').className='win-pill'+(won?' win':'');
  document.getElementById('winText').textContent=won?'Win day locked in':'Hit your non-negotiables';
  document.getElementById('winCount').textContent=coreDone+'/'+core.length;

  // streak
  const streak=getStreak();
  document.getElementById('streakCount').textContent=streak+(streak===1?' day':' days');
  document.getElementById('streakFill').style.width=Math.min(streak/30*100,100)+'%';

  // milestone banner
  const mb=document.getElementById('mbanner');
  if(MILESTONES.includes(streak)&&won){
    mb.className='mbanner show';
    mb.textContent=streak+' win days in a row. The engine is running — keep it lit.';
  }else mb.className='mbanner';

  // blocks by hour
  const wrap=document.getElementById('sections');
  wrap.innerHTML='';
  const todayItems=itemsForDay(dow);
  BLOCK_ORDER.forEach(block=>{
    const items=todayItems.filter(it=>it.block===block);
    if(!items.length)return;
    const doneN=items.filter(it=>dayChecks[it.id]).length;
    const sh=document.createElement('div');
    sh.className='sh';
    sh.innerHTML=`<span>${block}</span><span class="count">${doneN}/${items.length}</span>`;
    wrap.appendChild(sh);
    const list=document.createElement('div');
    list.className='checks';
    items.forEach(it=>list.appendChild(checkRow(it,today,dayChecks)));
    wrap.appendChild(list);
  });

  renderHeatmap();
}
function renderHeatmap(){
  const map=document.getElementById('heatmap');map.innerHTML='';
  const now=new Date();const start=new Date(now);start.setDate(now.getDate()-89);
  while(start.getDay()!==1)start.setDate(start.getDate()-1);
  for(let i=0;i<91;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const ds=dateStr(d);const isFuture=d>now;
    let bg='#f0efe9';
    if(!isFuture){
      const sc=dayScore(ds);
      if(sc.total>0){
        const pct=sc.done/sc.total;
        if(pct===0)bg='#f0efe9';
        else if(pct<0.3)bg=YELLOWS[0];
        else if(pct<0.5)bg=YELLOWS[1];
        else if(pct<0.75)bg=YELLOWS[2];
        else if(pct<1)bg=YELLOWS[3];
        else bg=YELLOWS[4];
      }
    }
    const cell=document.createElement('div');
    cell.className='hm-cell'+(isFuture?' future':'')+(!isFuture&&isWinDay(ds)?' win':'')+(ds===state.selectedDay?' selected':'');
    cell.style.background=isFuture?'transparent':bg;
    if(!isFuture)cell.onclick=()=>{state.selectedDay=state.selectedDay===ds?null:ds;renderHeatmap();showDayDetail(ds)};
    map.appendChild(cell);
  }
}
function showDayDetail(ds){
  const el=document.getElementById('dayDetail');
  if(!state.selectedDay){el.classList.remove('show');return}
  const dow=dowOf(ds);const items=itemsForDay(dow);const c=state.checks[ds]||{};
  const d=new Date(ds+'T12:00:00');
  document.getElementById('ddDate').textContent=DAY_SHORT[dow]+', '+MONTH_SHORT[d.getMonth()]+' '+d.getDate()+(isWinDay(ds)?'  · WIN':'');
  const sc=dayScore(ds);
  document.getElementById('ddScore').textContent=sc.done+'/'+sc.total;
  const list=document.getElementById('ddItems');list.innerHTML='';
  items.forEach(it=>{
    const hit=!!c[it.id];
    const row=document.createElement('div');
    row.className='day-detail-item '+(hit?'hit':'miss')+(it.core?' core-di':'');
    row.innerHTML=`<span class="di-icon">${hit?'●':'○'}</span>${it.name}`;
    list.appendChild(row);
  });
  el.classList.add('show');
}

// =====================
// TOGGLE
// =====================
async function toggleCheck(date,itemId){
  if(!state.checks[date])state.checks[date]={};
  const wasOn=!!state.checks[date][itemId];
  const wasWin=isWinDay(date);
  if(wasOn)delete state.checks[date][itemId];else state.checks[date][itemId]=true;
  save();render();
  await pushCheck(date,itemId,!wasOn);
  if(!wasOn){
    const nowWin=isWinDay(date);
    if(nowWin&&!wasWin)toast('Win day locked in',true);
    else if(isPerfectDay(date))toast('Perfect day — everything done');
  }
}

// =====================
// INIT
// =====================
(async()=>{
  setSync(sb?'syncing':'off');
  if(sb){await pullCloud();}
  render();
})();
</script>
